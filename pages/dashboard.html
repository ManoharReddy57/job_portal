
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | JobConnect</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header class="navbar">
    <div class="logo">JobConnect</div>
    <nav>
        <a href="../index.html">Home</a>
        <a href="jobs.html">Find Jobs</a>
        <a href="profile.html">My Profile</a>
    </nav>
    <button class="apply-btn" onclick="logout()">Logout</button>
</header>

<main class="page-container">

    <h1 id="welcome">Candidate Dashboard</h1>
    <p>Manage your job applications and saved jobs.</p>

    <div class="dashboard-grid">
        <div class="dashboard-card">
            <h2 id="applicationCount">0</h2>
            <p>Total Applications</p>
        </div>

        <div class="dashboard-card">
            <h2 id="savedCount">0</h2>
            <p>Saved Jobs</p>
        </div>

        <div class="dashboard-card">
            <h2 id="pendingCount">0</h2>
            <p>Pending Applications</p>
        </div>
    </div>

    <h2>My Applications</h2>
    <br>
    <div id="applicationList"></div>

    <br><br>

    <h2>Saved Jobs</h2>
    <br>
    <div id="savedList" class="job-grid"></div>

</main>

<script src="../js/data.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/dashboard.js"></script>

</body>
</html>
